definitions:
- lang: fi
  text: Data analytiikka on prosessi, jossa analysoidaan, kerätään, järjestetään ja tallennetaan raakadataa
    liiketoiminnan kannalta merkityksellisten havaintojen saamiseksi.
- lang: sv
  text: Dataanalytik är en process där rådata analyseras, samlas in, organiseras och lagras för att få
    fram observationer som är relevanta för affärsverksamheten.
- lang: en
  text: Data analytics is a process in which raw data is analyzed, collected, organized and stored in
    order to obtain observations relevant to business operations.
