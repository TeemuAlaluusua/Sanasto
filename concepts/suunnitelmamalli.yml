id: suunnitelmamalli
status: []
schemeId: []
terms:
- lang: fi
  label: suunnitelmamalli
  type: Suositettava termi
- lang: sv
  label: projekteringsmodell
  type: Suositettava termi
- lang: en
  label: design model
  type: Suositettava termi
definitions:
- lang: fi
  text: rakennuskohteen informaatiomalli, joka sisältää tiedot suunniteltavan rakennuskohteen rakenteista
    sekä rakennusosista ja niiden ominaisuuksista
- lang: sv
  text: informationsmodell av byggnadsobjekt som innehåller uppgifter om det byggnadsobjekt som ska projekteras,
    dess konstruktioner samt byggdelar och deras egenskaper
- lang: en
  text: information model of a construction entity that contains information on the structures of the
    construction entity to be designed, as well as its building components and their properties
notes:
- lang: fi
  text: 'Käsitejärjestelmäkaavio: https://sanastokeskus.fi/suomi.fi/rymallit/tietomalli.svg'
- lang: fi
  text: Suunnitelmamallia käytetään ja kehitetään eteenpäin rakennuskohteen suunnitteluvaiheen aikana.
    Ainakin osaa suunnitelmamallin tiedoista käytetään lupamallissa.
- lang: sv
  text: 'Begreppssystemschema: https://sanastokeskus.fi/suomi.fi/rymallit/tietomalli.svg'
- lang: sv
  text: Projekteringsmodellen används och utvecklas vidare under byggnadsobjektets projekteringsskede.
    Åtminstone en del av projekteringsmodellens uppgifter används i tillståndsmodellen.
- lang: en
  text: 'Concept system diagram: https://sanastokeskus.fi/suomi.fi/rymallit/tietomalli.svg'
- lang: en
  text: The design model is used and further developed during the design stage of the construction entity.
    At least some of the design model's data is used in the permit model.
