definitions:
- lang: fi
  text: GLN on GS1:n yksilöinnin standardi, jolla voidaan yksilöidä yritys, sen sisäisiä toimintoja tai
    toimipisteitä. Sähköisen kaupan sanomissa GLN:ää käytetään yksilöimään liiketapahtuman osapuolia esim.
    tilaamisen, toimittamisen, laskuttamisen ja sanomavälityksen tarpeisiin. GLN-tunnuksen kautta varmistetaan,
    että verkkolaskut ja muut sähköiset asiakirjat saapuvat oikealle vastaanottajalle yritysverkoissa.
- lang: sv
  text: GLN är en GS1-identifieringsstandard som kan användas för att identifiera ett företag, dess interna
    funktioner eller dess verksamhetsställen. I meddelanden för elektronisk handel används GLN för att
    identifiera parterna i en affärstransaktion, till exempel för beställning, leverans, fakturering och
    meddelandeförmedling. GLN bidrar till att säkerställa att e-fakturor och andra elektroniska dokument
    når rätt mottagare i företagsnätverk.
- lang: en
  text: GLN is a GS1 identification standard used to identify a company, its internal functions, or its
    locations. In e-commerce messages, the GLN is used to identify the parties to a transaction, for example
    for ordering, delivery, invoicing and message exchange. The GLN helps ensure that e-invoices and other
    electronic documents reach the correct recipient within business networks.
