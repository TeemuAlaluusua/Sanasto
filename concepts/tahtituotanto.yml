definitions:
- lang: fi
  text: Tahtituotanto on rakennushankkeiden johtamismenetelmä, joka pyrkii radikaalisti parempaan tuotantosysteemin
    rytmiin ja virtaukseen, tarkalla tuotannon suunnittelulla (tahtisuunnittelu), rytmitetyllä tuotannon
    ohjauksella (tahtiohjaus) sekä yli projektien tapahtuvalla jatkuvalla parantamisella.
- lang: sv
  text: Taktproduktion är en ledningsmetod för byggprojekt som strävar efter en radikalt bättre rytm och
    ett bättre flöde i produktionssystemet, genom exakt produktionsplanering (taktplanering), rytmiserad
    produktionsstyrning (taktstyrning) samt kontinuerlig förbättring över projektgränserna.
- lang: en
  text: Takt production is a management method for construction projects that seeks a radically better
    rhythm and flow in the production system, through precise production planning (takt planning), rhythmic
    production control (takt control), and continuous improvement across projects.
