definitions:
- lang: fi
  text: langaton radiotaajuinen tunnistusjärjestelmä, joka käyttää elektromagneettista kenttää siirtämään
    dataa aineelliseen objektiin kiinnitetystä tarrasta automaattista tunnistusta ja seurantaa varten
- lang: sv
  text: trådlöst radiofrekvensbaserat identifieringssystem som använder ett elektromagnetiskt fält för
    att överföra data från en etikett fäst på ett fysiskt objekt, i syfte att automatiskt identifiera
    och spåra objektet
- lang: en
  text: wireless radio-frequency identification system that uses an electromagnetic field to transfer
    data from a tag attached to a physical object, for the purpose of automatic identification and tracking
