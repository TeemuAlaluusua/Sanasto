definitions:
- lang: fi
  text: Liiketoimintatiedon hallinta (BI) tarkoittaa prosessuaalista ja teknistä infrastruktuuria, joka
    kerää, tallentaa ja analysoi yrityksen toiminnan tuottamaa tietoa.
- lang: sv
  text: Verksamhetsanalys (BI) avser den processuella och tekniska infrastruktur som samlar in, lagrar
    och analyserar information som genereras av företagets verksamhet.
- lang: en
  text: Business intelligence (BI) refers to the procedural and technical infrastructure that collects,
    stores and analyzes information generated by a company's operations.
notes:
- lang: fi
  text: Microsoft Power BI on yksi suosituista BI-ohjelmistoista, jota yritykset käyttävät tietojen analysointiin
    ja raportointiin.
- lang: sv
  text: Microsoft Power BI är en av de populära BI-programvarorna som företag använder för dataanalys
    och rapportering.
- lang: en
  text: Microsoft Power BI is one of the popular BI software tools that companies use for data analysis
    and reporting.
