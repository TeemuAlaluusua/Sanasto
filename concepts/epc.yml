definitions:
- lang: fi
  text: EPC on GS1:n standardi RFID:lle. Sillä yksilöidään esimerkiksi logistiset yksiköt, sijainnit ja
    muut toimitusketjun tiedot RFID-teknologiaan soveltuviksi. EPC:tä voidaan käyttää eri yhteyksissä,
    esimerkiksi binäärimuodossa RFIDtunnisteisiin koodattuna tai tekstimuodossa tietojen jakamiseksi yritysten
    järjestelmien välillä.
- lang: sv
  text: EPC är GS1:s standard för RFID. Med den identifieras till exempel logistiska enheter, platser
    och andra uppgifter i leveranskedjan så att de lämpar sig för RFID-teknik. EPC kan användas i olika
    sammanhang, till exempel kodad i binärt format på RFID-taggar eller i textformat för att dela information
    mellan företagens system.
- lang: en
  text: EPC is GS1's standard for RFID. It is used to identify, for example, logistics units, locations
    and other supply chain information in a form suitable for RFID technology. EPC can be used in various
    contexts, for example encoded in binary form on RFID tags or in text form to share information between
    companies' systems.
