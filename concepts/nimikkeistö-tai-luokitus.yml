terms:
- lang: fi
  label: Nimikkeistö (tai luokitus)
  type: Suositettava termi
- lang: sv
  label: nomenklatur (eller klassificering)
  type: Suositettava termi
- lang: en
  label: classification
  type: Suositettava termi
definitions:
- lang: fi
  text: Nimikkeistöillä tarkoitetaan tässä yhteydessä (nimikkeiden muodostama kokonaisuus) systemaattista
    ja standardisoitua luokittelua, jolla identifioidaan, koodataan ja nimetään fyysinen tuote, tuotteen
    osa tai komponentti, materiaali tai palvelu.
- lang: sv
  text: Med nomenklaturer avses i detta sammanhang (den helhet som nomenklaturerna bildar) en systematisk
    och standardiserad klassificering med vilken en fysisk produkt, produktdel eller komponent, ett material
    eller en tjänst identifieras, kodas och namnges.
- lang: en
  text: In this context, classification refers to (the set formed by the classification items) a systematic
    and standardized categorization used to identify, code and name a physical product, product part or
    component, material or service.
