definitions:
- lang: fi
  text: Tapahtumatiedot ovat eräänlaisia tietoja, joita kerätään ja tallennetaan erilaisilla seurantatyökaluilla
    tai -menetelmillä, jotta saadaan tietoa toimitusketjun tapahtumista.
- lang: sv
  text: Händelsedata är en typ av information som samlas in och lagras med olika uppföljningsverktyg eller
    -metoder för att få information om händelser i leveranskedjan.
- lang: en
  text: Event data is a type of information collected and stored using various monitoring tools or methods
    in order to obtain information on events within the supply chain.
