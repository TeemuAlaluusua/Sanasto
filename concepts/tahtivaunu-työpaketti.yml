definitions:
- lang: fi
  text: ”Arvoa tuottava prosessi”. Kuvaa sitä tehtäväkokonaisuutta, jonka työryhmä suorittaa yhdellä tahtialueella
    yhden tahtiajan aikana.
- lang: sv
  text: '"En värdeskapande process." Beskriver den uppgiftshelhet som en arbetsgrupp utför inom ett taktområde
    under en taktid.'
- lang: en
  text: '"A value-adding process." Describes the set of tasks that a work crew performs within one takt
    area during one takt time.'
