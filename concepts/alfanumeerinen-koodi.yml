definitions:
- lang: fi
  text: Alfanumeerinen koodi (myös aakkosnumeerinen koodi) tarkoittaa aakkosista (a-z) ja numeroista (0-9)
    koostuvaa koodia, jossa hyödynnetään myös välimerkkejä.
- lang: sv
  text: Alfanumerisk kod (även alfanumerisk kod) avser en kod som består av bokstäver (a-z) och siffror
    (0-9), där även skiljetecken används.
- lang: en
  text: An alphanumeric code refers to a code consisting of letters (a-z) and digits (0-9), which also
    makes use of punctuation marks.
