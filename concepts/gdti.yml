definitions:
- lang: fi
  text: GDTI on GS1:n yksilöinnin standardi, jota käytetään yksilöimään erilaisia dokumenttityyppejä,
    kuten laskuja tai kuljetusasiakirjoja.
- lang: sv
  text: GDTI är en GS1-identifieringsstandard som används för att identifiera olika dokumenttyper, såsom
    fakturor eller transportdokument.
- lang: en
  text: GDTI is a GS1 identification standard used to identify different document types, such as invoices
    or transport documents.
