definitions:
- lang: fi
  text: Termillä IoT-järjestelmä tarkoitetaan järjestelmää, joka tarjoaa esineiden internetin toiminnallisuuksia.
    IoT-järjestelmä voi sisältää muun muassa IoT-laitteita, IoT-yhdyskäytäviä, sensoreita ja toimilaitteita.
- lang: sv
  text: Med termen IoT-system avses ett system som erbjuder funktioner för sakernas internet. Ett IoT-system
    kan bland annat innehålla IoT-enheter, IoT-gateways, sensorer och ställdon.
- lang: en
  text: The term IoT system refers to a system that provides Internet of Things functionalities. An IoT
    system may include, among other things, IoT devices, IoT gateways, sensors and actuators.
