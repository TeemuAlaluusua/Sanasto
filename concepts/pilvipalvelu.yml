definitions:
- lang: fi
  text: pilvipalvelu on yksi tai useampi toiminnallisuus, jota tarjotaan pilvilaskennan mukaisesti ja
    käytetään määritellyn rajapinnan kautta. Yksinkertaisesti sanottuna pilvipalvelut mahdollistavat tietojen
    tallentamisen ja käsittelemisen internetissä sijaitsevilla palvelimilla sen sijaan, että ne olisivat
    paikallisesti omassa tietokoneessa tai organisaatioiden omilla palvelimilla. Näitä palveluita voivat
    olla esimerkiksi tiedostojen tallennus, sähköposti, verkkosovellukset ja tietokantapalvelut. Pilvipalveluiden
    avulla käyttäjät voivat käyttää tietoja ja sovelluksia mistä tahansa, missä on internet-yhteys, mikä
    tekee niistä käteviä ja joustavia käyttää.
- lang: sv
  text: En molntjänst är en eller flera funktioner som tillhandahålls enligt principerna för molntjänstbaserad
    databehandling och som används via ett definierat gränssnitt. Enkelt uttryckt gör molntjänster det
    möjligt att lagra och behandla information på servrar som finns på internet, i stället för lokalt
    på en egen dator eller på organisationens egna servrar. Sådana tjänster kan till exempel vara fillagring,
    e-post, webbapplikationer och databastjänster. Med hjälp av molntjänster kan användarna använda information
    och applikationer var som helst där det finns internetuppkoppling, vilket gör dem praktiska och flexibla
    att använda.
- lang: en
  text: A cloud service is one or more functionalities provided in accordance with cloud computing and
    accessed through a defined interface. Simply put, cloud services allow data to be stored and processed
    on servers located on the internet, rather than locally on one's own computer or on an organization's
    own servers. Such services may include, for example, file storage, email, web applications and database
    services. Cloud services allow users to access data and applications from anywhere with an internet
    connection, making them convenient and flexible to use.
