definitions:
- lang: fi
  text: Organisaation strategisiin tavoitteisiin perustuvat informaatiovaatimukset, joilla kuvataan mitä tietoa organisaatio tarvitsee omaisuuskohteidensa ja toimintansa johtamiseen.

- lang: sv
  text: Informationskrav som grundar sig på organisationens strategiska mål och som beskriver vilken information organisationen behöver för att leda sina tillgångar och sin verksamhet.

- lang: en
  text: Information requirements in relation to organizational objectives, describing what information an organization needs to manage its assets and operations.

notes:
- lang: fi
  text: |
    OIR on ISO 19650 -standardin mukaisen informaatiovaatimushierarkian
    ylin taso, josta johdetaan omaisuuskohteen informaatiovaatimukset
    (AIR) ja projektin informaatiovaatimukset (PIR).

