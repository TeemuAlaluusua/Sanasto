definitions:
- lang: fi
  text: |
    Toiminnanohjausjärjestelmä on yrityksen tietojärjestelmä, joka integroi eri
    toimintoja, esimerkiksi tuotantoa, jakelua, varastonhallintaa, laskutusta ja
    kirjanpitoa.

- lang: sv
  text: |
    Ett affärssystem är ett företags informationssystem som integrerar olika
    funktioner, till exempel produktion, distribution, lagerhantering,
    fakturering och bokföring.

- lang: en
  text: |
    Enterprise resource planning is a company's information system that
    integrates different functions, such as production, distribution,
    inventory management, invoicing and accounting.

