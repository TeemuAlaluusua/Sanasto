- lang: fi
  text: GMN on GS1:n yksilöinnin standardi, jonka käyttökohteena on laskentaryhmän, tuotetyyppien tai
    tuotteen mallin yksilöinti.
- lang: sv
  text: GMN är en GS1-identifieringsstandard som används för att identifiera en produktmodell, en produkttyp
    eller en grupp av handelsvaror.
- lang: en
  text: GMN is a GS1 identification standard used to identify a product model, a product type, or a group
    of trade items.
