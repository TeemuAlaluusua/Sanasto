definitions:
- lang: fi
  text: |
    URI-merkkijono, joka yksilöi resurssin ja samalla kertoo, miten
    ja mistä verkko-osoitteesta resurssi on saatavissa (esim. sen
    verkkoprotokolla ja sijainti).

- lang: sv
  text: |
    En URI-sträng som identifierar en resurs och samtidigt anger hur
    och varifrån resursen kan hämtas (t.ex. protokoll och plats).

- lang: en
  text: |
    A URI string that identifies a resource while also specifying the
    means of locating it, such as its network protocol and address.

notes:
- lang: fi
  text: |
    URL on yksi URI:n muoto; kaikki URL:t ovat URI:ita, mutta kaikki
    URI:t eivät ole URL:eja (esim. pelkkä nimeävä URN ei kerro
    resurssin sijaintia).

