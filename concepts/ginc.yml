definitions:
- lang: fi
  text: GINC on GS1:n yksilöinnin standardi, jota käytetään yksilöimään yhden tai useamman logistisen
    yksikön muodostama lähetys, joka on tarkoitettu kuljetettavaksi yhdessä ja dokumentoidaan samalle
    kuljetusasiakirjalle.
- lang: sv
  text: GINC är en GS1-identifieringsstandard som används för att identifiera en sändning som består av
    en eller flera logistiska enheter avsedda att transporteras tillsammans, dokumenterade under samma
    transportdokument.
- lang: en
  text: GINC is a GS1 identification standard used to identify a consignment formed of one or more logistics
    units that are intended to be transported together and documented on the same transport document.
