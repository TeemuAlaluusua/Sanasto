definitions:
- lang: fi
  text: järjestelmä haluttujen tuotteiden tai palvelujen tuottamiseen, mukaan lukien laadunvalvonta, dokumenttien hallinta, tuotannonohjaus, keskeneräisen tuotannon seuranta, yksityiskohtainen tuotteen reititys ja seuranta, työraportointi, resurssien ja uudelleentyöstön hallinta, tuotannon mittaus ja tiedonkeruu

- lang: sv
  text: system för att producera önskade produkter eller tjänster, inklusive kvalitetskontroll, dokumenthantering, produktionsstyrning, uppföljning av arbete under produktion, detaljerad produktdirigering och spårning, arbetsrapportering, hantering av resurser och omarbete samt produktionsmätning och datainsamling

- lang: en
  text: system for producing the desired products or services, including quality control, document management, plant floor dispatching, work-in-process tracking, detailed product routing and tracking, labour reporting, resource and rework management, production measurement and data collection

