- lang: en
  label: validation
  type: Suositettava termi
definitions:
- lang: fi
  text: Validointi tarkoittaa objektiiviseen näyttöön perustuvaa varmistumista siitä, että tiettyä aiottua
    käyttö- tai sovellustarkoitusta koskevat vaatimukset on täytetty.
- lang: sv
  text: Validering innebär en objektivt underbyggd bekräftelse av att kraven för en viss avsedd användning
    eller tillämpning har uppfyllts.
- lang: en
  text: Validation means objective-evidence-based confirmation that the requirements for a particular
    intended use or application have been met.
