terms:
- lang: fi
  label: rakennuskohteen informaatiomalli
  type: Suositettava termi
- lang: sv
  label: informationsmodell av byggnadsobjekt
  type: Suositettava termi
- lang: en
  label: information model of construction entity
  type: Suositettava termi
definitions:
- lang: fi
  text: informaatiomalli, joka sisältää rakennuskohteen tiedot
- lang: sv
  text: informationsmodell som innehåller uppgifter om byggnadsobjektet
- lang: en
  text: information model that contains information on the construction entity
notes:
- lang: fi
  text: 'Käsitejärjestelmäkaavio: https://sanastokeskus.fi/suomi.fi/rymallit/tietomalli.svg'
- lang: fi
  text: Erilaisilla rakennuskohteen informaatiomalleilla voidaan kuvata kohteen eri vaiheita koko sen
    elinkaaren ajan.
- lang: sv
  text: 'Begreppssystemschema: https://sanastokeskus.fi/suomi.fi/rymallit/tietomalli.svg'
- lang: sv
  text: Med olika informationsmodeller av byggnadsobjektet kan objektets olika skeden beskrivas under
    hela dess livscykel.
- lang: en
  text: 'Concept system diagram: https://sanastokeskus.fi/suomi.fi/rymallit/tietomalli.svg'
- lang: en
  text: Different information models of a construction entity can be used to describe the entity's various
    stages throughout its entire lifecycle.
