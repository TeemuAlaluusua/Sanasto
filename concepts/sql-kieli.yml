definitions:
- lang: fi
  text: Rakenteellinen kyselykieli SQL on tietokannan kyselyt määrittelevä kansainvälinen standardi. SQL
    on käytännössä ainoa kieli relaatiotietokantojen kyselyihin ja käsittelyyn. Hadoopin ja monien NoSQL-tietokantojen
    päälle on tehty SQL-liittymiä. SQL kyselykieli toimii hyvänä rajapintana relaatiokantojen ja lukemattomien
    työkalujen välissä (esim. BI-tuotteet).
- lang: sv
  text: Det strukturerade frågespråket SQL är en internationell standard som definierar databasfrågor.
    SQL är i praktiken det enda språket för att fråga och bearbeta relationsdatabaser. SQL-gränssnitt
    har byggts ovanpå Hadoop och många NoSQL-databaser. SQL-frågespråket fungerar som ett bra gränssnitt
    mellan relationsdatabaser och ett stort antal verktyg (t.ex. BI-produkter).
- lang: en
  text: The structured query language SQL is an international standard that defines database queries.
    SQL is, in practice, the only language for querying and processing relational databases. SQL interfaces
    have been built on top of Hadoop and many NoSQL databases. The SQL query language serves as a good
    interface between relational databases and countless tools (e.g. BI products).
