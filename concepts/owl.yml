definitions:
- lang: fi
  text: |
    W3C:n suosittelema kieli ontologioiden kuvaamiseen; mahdollistaa
    RDF-tietoa rikkaamman luokkien, ominaisuuksien ja niiden välisten
    suhteiden ja päättelysääntöjen määrittelyn.

- lang: sv
  text: |
    Ett W3C-rekommenderat språk för att beskriva ontologier; möjliggör
    en rikare definition av klasser, egenskaper och relationer samt
    slutledningsregler än vad RDF ensamt medger.

- lang: en
  text: |
    A W3C-recommended language for describing ontologies; enables
    richer definitions of classes, properties, relationships and
    inference rules than RDF alone provides.

notes:
- lang: fi
  text: |
    OWL rakentuu RDF:n ja RDF Scheman päälle ja sitä käytetään yhdessä
    SPARQL-kyselykielen kanssa semanttisen webin sovelluksissa.

