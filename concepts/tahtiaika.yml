definitions:
- lang: fi
  text: Tahtiaika kuvaa sitä aikaa, jossa tietty työtehtävä on tarkoitus suorittaa.
- lang: sv
  text: Taktiden beskriver den tid inom vilken en viss arbetsuppgift är avsedd att utföras.
- lang: en
  text: Takt time describes the time within which a particular work task is intended to be completed.
