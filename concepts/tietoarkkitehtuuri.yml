- lang: sv
  label: informationsarkitektur
  type: Suositettava termi
- lang: en
  label: information architecture
  type: Suositettava termi
definitions:
- lang: fi
  text: Tietoarkkitehtuurilla tarkoitetaan keinoa järjestää ja merkitä datan hallintajärjestelmiin ja
    varastoihin tallennettua tietosisältöä ja dokumentteja haun, tietoturvan ja käytettävyyden helpottamiseksi.
- lang: sv
  text: Med informationsarkitektur avses ett sätt att organisera och märka det informationsinnehåll och
    de dokument som lagras i datahanteringssystem och lager, för att underlätta sökning, informationssäkerhet
    och användbarhet.
- lang: en
  text: Information architecture refers to a way of organizing and labeling the information content and
    documents stored in data management systems and repositories, in order to facilitate search, information
    security and usability.
