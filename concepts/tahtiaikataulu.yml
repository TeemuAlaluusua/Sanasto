definitions:
- lang: fi
  text: Tahtiaikataulu on tahtisuunnittelun tuotoksena syntyvä ja tahtiohjauksen kautta ohjattava aikataulu,
    joka kertoo missä, miten ja millä resusseilla hankkeen ja tuotannon eri tehtäviä toteutetaan.
- lang: sv
  text: Taktschemat är ett tidsschema som tas fram som ett resultat av taktplaneringen och som styrs genom
    taktstyrning. Det anger var, hur och med vilka resurser projektets och produktionens olika uppgifter
    genomförs.
- lang: en
  text: A takt schedule is a schedule produced as a result of takt planning and controlled through takt
    control. It indicates where, how and with what resources the various tasks of the project and production
    are carried out.
