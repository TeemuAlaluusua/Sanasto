definitions:
- lang: fi
  text: Lähtötiedot ovat eri tietolähteistä saatua tai mitattua tuotteiden, toiminnan ja palveluiden suunnittelua
    varten hankittua informaatiota.
- lang: sv
  text: Utgångsuppgifter är information som erhållits från eller mätts upp via olika informationskällor
    och som anskaffats för projektering av produkter, verksamhet och tjänster.
- lang: en
  text: Initial data is information obtained from or measured via various data sources, acquired for the
    design of products, operations and services.
