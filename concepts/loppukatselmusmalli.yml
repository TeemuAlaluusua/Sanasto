definitions:
- lang: fi
  text: ennen rakennuskohteen käyttöönottoa vaadittava rakennuskohteen informaatiomalli, joka sisältää
    lupamallia vastaavat, toteutuksen mukaisesti päivitetyt tiedot
- lang: sv
  text: informationsmodell av byggnadsobjekt som krävs innan byggnadsobjektet tas i bruk och som innehåller
    uppgifter motsvarande tillståndsmodellen, uppdaterade enligt genomförandet
- lang: en
  text: information model of a construction entity required before the construction entity is taken into
    use, containing information corresponding to the permit model, updated according to the as-built implementation
