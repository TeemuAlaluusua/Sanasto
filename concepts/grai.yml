definitions:
- lang: fi
  text: GRAI on GS1:n yksilöinnin standardi kiertävien kuormankantajien (palautettavat kuormalavat, laatikot,
    rullakot yms.) yksilöintiin.
- lang: sv
  text: GRAI är en GS1-identifieringsstandard för identifiering av returlastbärare i omlopp (returpallar,
    backar, rullburar med mera).
- lang: en
  text: GRAI is a GS1 identification standard for identifying returnable transport items in circulation
    (returnable pallets, crates, roll cages, etc.).
