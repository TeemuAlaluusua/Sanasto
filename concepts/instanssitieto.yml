definitions:
- lang: fi
  text: Instanssitiedoilla tarkoitetaan tietyn tuoteyksilön yksilöivää tunnistetta ja tämän yksilön tarkempaa
    yksilöllistä tuotetietoa. Esimerkiksi valaisimeen liittyvä instanssitieto auttaa yksilöimään mihin
    tilaan kyseinen valaisinyksilö on suunniteltu asennettavaksi.
- lang: sv
  text: Med instansdata avses en unik identifierare för en viss produktindivid samt mer detaljerad individuell
    produktinformation om denna individ. Till exempel instansdata kopplad till en armatur hjälper till
    att identifiera i vilket utrymme just den armaturen är avsedd att installeras.
- lang: en
  text: Instance data refers to a unique identifier for a specific product unit and the more detailed,
    individual product information related to that unit. For example, instance data associated with a
    luminaire helps to identify the space in which that particular luminaire is intended to be installed.
