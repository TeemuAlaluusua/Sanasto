terms:
- lang: fi
  label: suljettu toimintaympäristö
  type: Suositettava termi
- lang: sv
  label: sluten verksamhetsmiljö
  type: Suositettava termi
- lang: en
  label: closed operating environment
  type: Suositettava termi
definitions:
- lang: fi
  text: Sovellus, joka on tarkoitettu suljetun käyttäjäryhmän käyttöön, yleensä yhden organisaation sisällä
    tai tietyn sopimuksen mukaisesti.
- lang: sv
  text: En tillämpning avsedd för en sluten användargrupp, vanligtvis inom en och samma organisation eller
    enligt ett visst avtal.
- lang: en
  text: An application intended for use by a closed user group, usually within a single organization or
    in accordance with a specific agreement.
