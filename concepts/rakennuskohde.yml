id: rakennuskohde
status: []
schemeId: []
terms:
- lang: fi
  label: rakennuskohde
  type: Suositettava termi
- lang: sv
  label: byggnadsobjekt
  type: Suositettava termi
- lang: en
  label: construction
  type: Suositettava termi
definitions:
- lang: fi
  text: fyysinen kokonaisuus, jota parhaillaan rakennetaan tai joka on rakennettu
- lang: sv
  text: fysisk helhet som håller på att byggas eller som har byggts
- lang: en
  text: physical entity that is being built or has been built
notes:
- lang: fi
  text: Infrarakentamisessa rakennuskohteita voidaan kutsua infrakohteiksi. Niitä ovat esimerkiksi liikenneväylät,
    padot ja satamat.
- lang: fi
  text: Talonrakennuksessa rakennuskohteita ovat esimerkiksi rakennukset, rakennelmat ja niiden ulkoalueet.
- lang: fi
  text: 'Käsitejärjestelmäkaavio: https://sanastokeskus.fi/suomi.fi/rymallit/tietomalli.svg'
- lang: sv
  text: Inom infrastrukturbyggande kan byggnadsobjekt kallas infraobjekt. Sådana är till exempel trafikleder,
    dammar och hamnar.
- lang: sv
  text: Inom husbyggande är byggnadsobjekt till exempel byggnader, konstruktioner och deras utomhusområden.
- lang: sv
  text: 'Begreppssystemschema: https://sanastokeskus.fi/suomi.fi/rymallit/tietomalli.svg'
- lang: en
  text: In infrastructure construction, construction entities may be called infrastructure entities. Examples
    include traffic routes, dams and harbors.
- lang: en
  text: In building construction, construction entities include, for example, buildings, structures and
    their outdoor areas.
- lang: en
  text: 'Concept system diagram: https://sanastokeskus.fi/suomi.fi/rymallit/tietomalli.svg'
sources:
