- lang: fi
  text: GIAI on GS1:n yksilöinnin standardi, jota käytetään käyttöomaisuuden (esim. sähkömittareiden)
    yksilöintiin.
- lang: sv
  text: GIAI är en GS1-identifieringsstandard som används för att identifiera anläggningstillgångar (t.ex.
    elmätare).
- lang: en
  text: GIAI is a GS1 identification standard used to identify fixed assets (e.g. electricity meters).
