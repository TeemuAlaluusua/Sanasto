- lang: sv
  label: transportinteroperabilitet
  type: Suositettava termi
- lang: en
  label: transport interoperability
  type: Suositettava termi
definitions:
- lang: fi
  text: Tiedonsiirron yhteentoimivuudella tarkoitetaan yhteentoimivuutta, jossa osallisten järjestelmien
    välisessä tiedonsiirrossa käytetään sovittua viestintäinfrastruktuuria.
- lang: sv
  text: Med transportinteroperabilitet avses interoperabilitet där dataöverföringen mellan de deltagande
    systemen sker via en överenskommen kommunikationsinfrastruktur.
- lang: en
  text: Transport interoperability refers to interoperability in which data transfer between the participating
    systems uses an agreed communication infrastructure.
