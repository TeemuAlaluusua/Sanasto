  label: human-readable
  type: Suositettava termi
definitions:
- lang: fi
  text: Ihmisten käyttötarkoituksiin luotua tietoa. Esimerkiksi kaksiulotteiset kartat, piirrokset ja
    sanalliset selostukset. Käytetään kuvaamaan tiedon muotoa, josta voi lukea suoraan ja ymmärrettävästi
    asioiden merkityksen.
- lang: sv
  text: Information som skapats för mänskliga användningsändamål. Till exempel tvådimensionella kartor,
    ritningar och verbala beskrivningar. Används för att beskriva en informationsform som direkt och begripligt
    kan läsas för att förstå innebörden av saker.
- lang: en
  text: Information created for human purposes. For example, two-dimensional maps, drawings and verbal
    descriptions. Used to describe a form of information that can be read directly and understandably
    to grasp the meaning of things.
