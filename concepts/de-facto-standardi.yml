  label: de facto standard
  type: Suositettava termi
definitions:
- lang: fi
  text: Käytännön standardin aseman saavuttanut menetelmä tms., jota ei ole standardoitu virallisessa
    standardointiorganisaatiossa.
- lang: sv
  text: En metod eller liknande som har uppnått ställning som praktisk standard utan att ha standardiserats
    av en officiell standardiseringsorganisation.
- lang: en
  text: A method or similar that has achieved the status of a practical standard without having been standardized
    by an official standards organization.
