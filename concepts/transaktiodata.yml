- lang: sv
  label: transaktionsdata
  type: Suositettava termi
- lang: en
  label: transactional data
  type: Suositettava termi
definitions:
- lang: fi
  text: Transaktiodata syntyy yritystoiminnassa ja sisältää liiketapahtumakohtaisia tietoja. Transaktiodataa
    on esimerkiksi ostoista ja tilauksista saatava data.
- lang: sv
  text: Transaktionsdata uppstår i affärsverksamheten och innehåller uppgifter kopplade till enskilda
    affärshändelser. Transaktionsdata kan till exempel vara data som fås från inköp och beställningar.
- lang: en
  text: Transactional data is generated in the course of business operations and contains information
    related to individual business transactions. Examples of transactional data include data obtained
    from purchases and orders.
