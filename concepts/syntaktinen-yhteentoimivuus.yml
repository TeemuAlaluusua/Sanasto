  label: syntaktinen yhteentoimivuus
  type: Suositettava termi
- lang: sv
  label: syntaktisk interoperabilitet
  type: Suositettava termi
- lang: en
  label: syntactic interoperability
  type: Suositettava termi
definitions:
- lang: fi
  text: Syntaktisella yhteentoimivuudella tarkoitetaan yhteentoimivuutta, jossa osalliset järjestelmät
    kykenevät ymmärtämään siirrettyjen tietojen muotoilut.
- lang: sv
  text: Med syntaktisk interoperabilitet avses interoperabilitet där de deltagande systemen kan förstå
    formateringen av den överförda informationen.
- lang: en
  text: Syntactic interoperability refers to interoperability in which the participating systems are able
    to understand the formatting of the data being transferred.
