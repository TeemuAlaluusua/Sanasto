definitions:
- lang: fi
  text: Tahtialue kuvaa tilaa, jossa tietty tehtäväkokonaisuus on tarkoitus suorittaa yhden tahtiajan
    aikana.
- lang: sv
  text: Taktområdet beskriver det utrymme inom vilket en viss uppgiftshelhet är avsedd att utföras under
    en taktid.
- lang: en
  text: A takt area describes the space within which a specific set of tasks is intended to be carried
    out during one takt time.
