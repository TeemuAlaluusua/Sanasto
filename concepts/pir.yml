definitions:
- lang: fi
  text: Informaatiovaatimukset, jotka kuvaavat mitä tietoa tarvitaan tukemaan projektin tavoitteisiin liittyvää päätöksentekoa projektin eri vaiheissa.

- lang: sv
  text: Informationskrav som beskriver vilken information som behövs för att stödja beslutsfattande relaterat till projektets mål under projektets olika skeden.

- lang: en
  text: Information requirements describing what information is needed to support decision-making related to the project's objectives at each project stage.

notes:
- lang: fi
  text: |
    PIR johdetaan organisaation informaatiovaatimuksista (OIR) ja
    omaisuuskohteen informaatiovaatimuksista (AIR), ja se puolestaan
    ohjaa vaihekohtaisten informaation vaihdon vaatimusten (EIR)
    määrittelyä ISO 19650 -standardin mukaisessa mallissa.

