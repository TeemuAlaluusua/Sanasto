definitions:
- lang: fi
  text: |
    W3C:n standardoima kyselykieli ja protokolla, jolla haetaan ja
    muokataan RDF-muodossa esitettyä tietoa.

- lang: sv
  text: |
    Ett W3C-standardiserat frågespråk och protokoll för att hämta och
    bearbeta data som representeras i RDF-format.

- lang: en
  text: |
    A W3C-standardized query language and protocol for retrieving and
    manipulating data represented in RDF format.

notes:
- lang: fi
  text: |
    SPARQL vastaa RDF-tietokantojen kyselykielenä samaa tarkoitusta
    kuin SQL relaatiotietokannoissa.

