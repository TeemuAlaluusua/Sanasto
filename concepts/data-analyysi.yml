definitions:
- lang: fi
  text: Data-analyysillä tarkoitetaan datan elinkaaren vaihetta, joka käsittää tekniikat, joita käytetään
    analyytikon tavoitteiden saavuttamiseen eli informatiivisen tiedon tuottamiseen organisoidusta datasta.
- lang: sv
  text: Med dataanalys avses ett skede i datans livscykel som omfattar de tekniker som används för att
    uppnå analytikerns mål, det vill säga för att producera informativ kunskap ur organiserad data.
- lang: en
  text: Data analysis refers to a stage in the data lifecycle comprising the techniques used to achieve
    the analyst's objectives, i.e. to produce informative knowledge from organized data.
