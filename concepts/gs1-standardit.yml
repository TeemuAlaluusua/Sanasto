definitions:
- lang: fi
  text: GS1 standardijärjestelmä perustuu tiedon (mm. asioiden, tavaroiden, paikkojen ja henkilöiden)
    -yksilöintiin, näiden fyysiseen tunnistamiseen, sekä -jakamiseen digitaalisessa muodossa toimitusketjun
    eri toimijoiden välillä.
- lang: sv
  text: GS1-standardsystemet bygger på individualisering av information (bland annat om saker, varor,
    platser och personer), fysisk identifiering av dessa samt delning av informationen i digital form
    mellan olika aktörer i leveranskedjan.
- lang: en
  text: The GS1 standards system is based on the individualization of information (e.g. about things,
    goods, places and persons), their physical identification, and the sharing of that information in
    digital form between different actors in the supply chain.
