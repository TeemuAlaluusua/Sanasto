definitions:
- lang: fi
  text: Tekoäly on tietojenkäsittelytieteen osa-alue, jonka tarkoituksena on kehittää tietojenkäsittelyjärjestelmiä,
    jotka suorittavat normaalisti ihmisen älykkyyteen liittyviä toimintoja, kuten päättelyä, oppimista
    ja itsensä parantamista.
- lang: sv
  text: Artificiell intelligens (AI) är ett delområde inom datavetenskap som syftar till att utveckla
    databehandlingssystem som utför funktioner som normalt förknippas med mänsklig intelligens, såsom
    resonemang, inlärning och självförbättring.
- lang: en
  text: Artificial intelligence (AI) is a branch of computer science that aims to develop data processing
    systems capable of performing functions normally associated with human intelligence, such as reasoning,
    learning and self-improvement.
