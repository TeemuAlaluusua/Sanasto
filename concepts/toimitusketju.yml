  label: construction supply chain
  type: Suositettava termi
definitions:
- lang: fi
  text: Rakentamisessa toimitusketju käsittää kaikki ne toimet ja toimijat, jotka liittyvät lopputuotteen
    tuottamiseen raaka-aineista.
- lang: sv
  text: Inom byggande omfattar leveranskedjan alla de åtgärder och aktörer som är kopplade till framställningen
    av slutprodukten från råmaterial.
- lang: en
  text: In construction, the supply chain covers all the activities and actors involved in producing the
    end product from raw materials.
