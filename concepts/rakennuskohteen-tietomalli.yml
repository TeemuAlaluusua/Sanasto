- lang: fi
  text: tietomalli, joka on tarkoitettu rakennuskohteen tietojen kuvaamiseen
- lang: sv
  text: datamodell avsedd för att beskriva uppgifter om byggnadsobjektet
- lang: en
  text: data model intended for describing information on the construction entity
notes:
- lang: fi
  text: 'Käsitejärjestelmäkaavio: https://sanastokeskus.fi/suomi.fi/rymallit/tietomalli.svg'
- lang: fi
  text: Sekä talonrakennuksen että infrarakentamisen kohteet ovat rakennuskohteita.
- lang: fi
  text: Rakennuskohteen tietomalli esitetään usein koneluettavassa muodossa.
- lang: sv
  text: 'Begreppssystemschema: https://sanastokeskus.fi/suomi.fi/rymallit/tietomalli.svg'
- lang: sv
  text: Både husbyggnads- och infrastrukturobjekt är byggnadsobjekt.
- lang: sv
  text: Byggnadsobjektets datamodell presenteras ofta i maskinläsbar form.
- lang: en
  text: 'Concept system diagram: https://sanastokeskus.fi/suomi.fi/rymallit/tietomalli.svg'
- lang: en
  text: Both building construction and infrastructure construction entities are construction entities.
- lang: en
  text: A construction entity's data model is often presented in machine-readable form.
